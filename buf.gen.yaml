version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/opentelemetry/opentelemetry
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/gateway/gen
# Protobuf and Connect plugins match their go.mod runtimes; gRPC matches the
# sibling services.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.13.0
    out: gen
    opt:
      - paths=source_relative
# The published BSR module lacks the reviewed lifecycle proposals. Generate
# every package the Gateway imports from this exact fork revision.
inputs:
  - git_repo: https://github.com/spk-ai/api.git
    ref: ce64da8680c39a13f7174c3146b38f3bfcc03037
    subdir: proto
    paths:
      - agynio/api/agent_state/v1
      - agynio/api/agents/v1
      - agynio/api/apps/v1
      - agynio/api/chat/v1
      - agynio/api/egress/v1
      - agynio/api/expose/v1
      - agynio/api/files/v1
      - agynio/api/gateway/v1
      - agynio/api/groups/v1
      - agynio/api/identity/v1
      - agynio/api/images/v1
      - agynio/api/llm/v1
      - agynio/api/metering/v1
      - agynio/api/networks/v1
      - agynio/api/notifications/v1
      - agynio/api/organizations/v1
      - agynio/api/runner/v1
      - agynio/api/runners/v1
      - agynio/api/secrets/v1
      - agynio/api/terminal_proxy/v1
      - agynio/api/threads/v1
      - agynio/api/token_counting/v1
      - agynio/api/tracing/v1
      - agynio/api/users/v1
      - agynio/api/ziti_management/v1
