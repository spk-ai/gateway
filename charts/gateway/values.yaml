nameOverride: ""
fullnameOverride: "gateway"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/gateway
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 2
revisionHistoryLimit: 10
updateStrategy: {}

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

rbac:
  create: false
  clusterWide: false
  rules: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  labels: {}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

command: []
args: []
env: []
envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts: []
extraVolumes: []

initContainers: []
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

startupProbe:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: nginx
  annotations: {}
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: http
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints:
      - port: http
        path: /metrics
        interval: ""
        scrapeTimeout: ""

gateway:
  agentsGrpcTarget: "agents:50051"
  appsGrpcTarget: "apps:50051"
  threadsGrpcTarget: "threads:50051"
  chatGrpcTarget: "chat:50051"
  notificationsGrpcTarget: "notifications:50051"
  filesGrpcTarget: "files:50051"
  agentStateGrpcTarget: "agent-state:50051"
  tokenCountingGrpcTarget: "token-counting:50051"
  meteringGrpcTarget: "metering:50051"
  secretsGrpcTarget: "secrets:50051"
  usersGrpcTarget: "users:50051"
  organizationsGrpcTarget: "organizations:50051"
  runnersGrpcTarget: "runners:50051"
  # Projected ServiceAccount token attached to Runners calls only (metadata
  # x-agyn-caller-token). Runners validates it with a TokenReview against this
  # audience and authorizes the gateway ServiceAccount. Kubelet rotates it; the
  # gateway re-reads it when the file changes.
  runnersCallerToken:
    enabled: true
    audience: agyn-runners
    expirationSeconds: 600
    mountPath: /var/run/secrets/agyn.io/runners-token
  exposeGrpcTarget: "expose:50051"
  egressRulesGrpcTarget: "egress-rules:50051"
  groupsGrpcTarget: "groups:50051"
  networksGrpcTarget: "networks:50051"
  oidcIssuerUrl: ""
  oidcClientId: ""
  # Workload identity with the Kubernetes ServiceAccount issuer. The deployment
  # repository sets these; the chart only passes them through, and the gateway
  # validates them at startup (see internal/oidcauth and README).
  #
  # OIDC_AUDIENCE: every OIDC bearer token's `aud` must contain this value.
  # Empty accepts any audience the issuer signs; with the Kubernetes issuer
  # that would admit every ServiceAccount token in the cluster.
  oidcAudience: ""
  # OIDC_CA_FILE: PEM bundle trusted, in addition to the system roots, for
  # OIDC discovery and JWKS requests only, e.g.
  # /var/run/secrets/kubernetes.io/serviceaccount/ca.crt.
  oidcCaFile: ""
  # OIDC_DISCOVERY_TOKEN_FILE: file sent as `Authorization: Bearer` on OIDC
  # discovery and JWKS requests to the https issuer and jwks_uri origins only,
  # re-read on every fetch, e.g. /var/run/secrets/kubernetes.io/serviceaccount/token
  # (requires automountServiceAccountToken). Requires oidcAudience.
  oidcDiscoveryTokenFile: ""
  # Where provisioning-time profile claims come from: "userinfo" (default) or
  # "token". Use "token" with IdPs that issue audience-restricted access tokens,
  # which the OIDC UserInfo endpoint rejects.
  oidcProfileSource: ""
  # Override the claim carrying each profile field. Empty keeps the OIDC default.
  oidcClaimName: ""
  oidcClaimEmail: ""
  oidcClaimPicture: ""
  oidcClaimPreferredUsername: ""
  clusterAdminToken: ""
  # Read the bootstrap token from an existing Secret instead of rendering it
  # into the Deployment. Mutually exclusive with clusterAdminToken.
  clusterAdminTokenSecret:
    name: ""
    key: token
  clusterAdminIdentityId: ""
