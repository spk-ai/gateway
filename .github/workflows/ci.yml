name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.66.1'
          github_token: ${{ github.token }}
          buf_api_token: ${{ secrets.BUF_TOKEN }}

      # buf.gen.yaml pins the reviewed spk-ai/api revision used by the image.
      - name: Generate gRPC stubs
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf generate --include-imports

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...
